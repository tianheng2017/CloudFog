# golangci-lint v2 配置（12 §5.1 CI 门禁）
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - bodyclose
    - copyloopvar
    - errorlint
    - noctx
    - revive
  settings:
    revive:
      rules:
        - name: package-comments
          disabled: true

issues:
  exclude-rules:
    # 测试文件允许非确定性断言辅助
    - path: _test\.go
      linters:
        - errcheck
